edition: 3.0.0
name: aura-backend-dev
access: "default" # todo: 在系统下新建火山引擎的 AK / SK 密钥

vars:
  sid: "aurabkdev"
  region: "cn-beijing"
  functionName: "aura-backend-function-dev"
  version: "0.0.51"

resources:
  aura_backend_dev:
    component: volcano-vefaas
    props:
      common:
        Region: ${vars.region}
      function:
        Name: ${vars.functionName}
        Description: aura-backend-dev
        RequestTimeout: 900
        ExclusiveMode: true
        Runtime: native/v1
        SourceType: image # 支持 image / zip
        Source: mengs-cn-beijing.cr.volces.com/aura/aura_backend_dev:${vars.version}
        MemoryMB: 16384
        Processor: cpu
        Envs:
          - Key: TOS_ENDPOINT
            Value: tos-cn-beijing.ivolces.com
          - Key: TOS_REGION
            Value: cn-beijing
          - Key: CLOUD_PROVIDER
            Value: TOS
          - Key: SERVER_PORT
            Value: '8000'
          - Key: OPENAI_API_KEY
            Value: dc7e10e7-1095-40ae-a172-3a7d16fc1e61
          - Key: OPENAI_BASE_URL
            Value: https://ark.cn-beijing.volces.com/api/v3
          - Key: POSTGRES_HOST
            Value: postgresfb9e27de51dc.rds-pg.ivolces.com
          - Key: POSTGRES_PORT
            Value: '5432'
          - Key: POSTGRES_DB
            Value: aura-PostgreSQL
          - Key: POSTGRES_USER
            Value: root
          - Key: POSTGRES_PASSWORD
            Value: X1KxZeMkM#nobqKiq
          - Key: POSTGRES_SCHEMA
            Value: public
        VpcConfig:
          EnableVpc: true
          EnableSharedInternetAccess: true
          VpcId: vpc-13g4piwtkhhc03n6nu5hmq2jt
          SubnetIds:
            - subnet-rrkuf0d9y800v0x58hi8g42
          SecurityGroupIds:
            - sg-13g4pj6oq1r7k3n6nu5jnw94u

      replicaLimit:
        MaxInstance: 10
      triggers:
        - TriggerName: apig-trigger
          TriggerType: apig
          GatewayId: "gd1qqo74fo0m61h76anf0" # todo: 新建 apig 后填写 gatewayId 即可
          ServiceName: "service-aurabkdev"
          UpstreamName: "upstream-aurabkdev"
          RouteName: default
          Path: "/"
          Method:
            - POST
            - GET
            - PUT
            - DELETE
            - HEAD
            - OPTIONS
            - CONNECT
          AdvancedSetting:
            CorsPolicySetting:
              Enable: true
