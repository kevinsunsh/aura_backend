edition: 3.0.0
name: aura-backend
access: "default" # todo: 在系统下新建火山引擎的 AK / SK 密钥

vars:
  sid: "aurabk"
  region: "cn-shanghai"
  functionName: "aura-backend-function"
  version: "0.0.3"

resources:
  aura_backend:
    component: volcano-vefaas
    props:
      common:
        Region: ${vars.region}
      function:
        Name: ${vars.functionName}
        Description: aura-backend
        ExclusiveMode: true
        RequestTimeout: 900
        Runtime: native/v1
        SourceType: image # 支持 image / zip
        Source: mengs-cn-shanghai.cr.volces.com/aura/aura_backend:${vars.version}
        MemoryMB: 1024
        Processor: cpu
        Envs:
          - Key: TOS_ENDPOINT
            Value: tos-cn-shanghai.ivolces.com
          - Key: TOS_REGION
            Value: cn-shanghai
          - Key: CLOUD_PROVIDER
            Value: TOS
          - Key: SERVER_PORT
            Value: '8000'
        VpcConfig:
          EnableVpc: true
          EnableSharedInternetAccess: true
          VpcId: vpc-3qdp4y7bewqv47prml0435ung
          SubnetIds:
            - subnet-22iyhsqz1g1s07r2qr11p3qgy
          SecurityGroupIds:
            - sg-3qdp4yf7jcyrk7prml0n2gmj3

      replicaLimit:
        MaxInstance: 10
      triggers:
        - TriggerName: apig-trigger
          TriggerType: apig
          GatewayId: "gd1jlf1k3k341ncbl2c5g" # todo: 新建 apig 后填写 gatewayId 即可
          ServiceName: "service-aurabk"
          UpstreamName: "upstream-aurabk"
          RouteName: default
          Path: "/"
          Method:
            - POST
            - GET
            - PUT
            - DELETE
            - HEAD
            - OPTIONS
            - CONNECT
          AdvancedSetting:
            CorsPolicySetting:
              Enable: true
