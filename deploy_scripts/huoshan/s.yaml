edition: 3.0.0
name: aura-backend
access: "default-1" # todo: 在系统下新建火山引擎的 AK / SK 密钥

vars:
  sid: "aurabk"
  region: "cn-beijing"
  functionName: "aura-backend-function"
  version: "0.0.1"

resources:
  nova_backend:
    component: volcano-vefaas
    props:
      common:
        Region: ${vars.region}
      function:
        Name: ${vars.functionName}
        Description: template for neo4j-agent
        ExclusiveMode: true
        RequestTimeout: 900
        Runtime: native/v1
        SourceType: image # 支持 image / zip
        Source: dcc-cloud-cn-beijing.cr.volces.com/dcc-cloud/aura_backend:${vars.version}
        MemoryMB: 4096
        Processor: cpu
        Envs:
          - Key: TOS_ENDPOINT
            Value: tos-cn-shanghai.ivolces.com
          - Key: TOS_REGION
            Value: cn-shanghai
          - Key: CLOUD_PROVIDER
            Value: TOS
          - Key: MCP_HOST
            Value: 10.7.224.23
          - Key: REDIS_HOST
            Value: redis-shzldk7uha71dzy8a.redis.ivolces.com
          - Key: SERVER_PORT
            Value: '8000'
          - Key: NEO4J_HOST
            Value: 10.7.224.29
        VpcConfig:
          EnableVpc: true
          EnableSharedInternetAccess: true
          VpcId: vpc-rs46tr20ji0wv0x58vge86q
          SubnetIds:
            - subnet-minbd39plbeo5smt1ai7jqqb
          SecurityGroupIds:
            - sg-mincr0qv7aww5smt1ak50w94

      replicaLimit:
        MaxInstance: 10
      triggers:
        - TriggerName: apig-trigger
          TriggerType: apig
          GatewayId: "gcp1jht7vgc9hjb8nftb0" # todo: 新建 apig 后填写 gatewayId 即可
          ServiceName: "service-aurabk"
          UpstreamName: "upstream-aurabk"
          RouteName: default
          Path: "/"
          Method:
            - POST
            - GET
            - PUT
            - DELETE
            - HEAD
            - OPTIONS
            - CONNECT
          AdvancedSetting:
            CorsPolicySetting:
              Enable: true
