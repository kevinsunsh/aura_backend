edition: 3.0.0
name: nova-backend
access: "default-data" # todo: 在系统下新建火山引擎的 AK / SK 密钥

vars:
  sid: "novabackend"
  region: "cn-shanghai"
  functionName: "nova-backend-function"
  version: "0.0.5"

resources:
  nova_backend:
    component: volcano-vefaas
    props:
      common:
        Region: ${vars.region}
      function:
        Name: ${vars.functionName}
        Description: template for neo4j-agent
        ExclusiveMode: true
        RequestTimeout: 10800
        AsyncConfig: # 异步配置
          EnableAsyncTask: true # 开启异步任务
        Runtime: native/v1
        SourceType: image # 支持 image / zip
        Source: unity-data-cn-shanghai.cr.volces.com/data-platform/nova-backend:${vars.version}
        MemoryMB: 16384
        Processor: cpu
        Envs:
          - Key: TOS_ENDPOINT
            Value: tos-cn-shanghai.ivolces.com
          - Key: TOS_REGION
            Value: cn-shanghai
          - Key: CLOUD_PROVIDER
            Value: TOS
          - Key: MCP_HOST
            Value: 10.7.224.23
          - Key: REDIS_HOST
            Value: redis-shzldk7uha71dzy8a.redis.ivolces.com
          - Key: SERVER_PORT
            Value: '8000'
          - Key: NEO4J_HOST
            Value: 10.7.224.29
        VpcConfig:
          EnableVpc: true
          EnableSharedInternetAccess: true
          VpcId: vpc-5gq2oliqyzgg73inqk1n6rxc
          SubnetIds:
            - subnet-3qe9gmqnxwzr47prml09zu5l8
          SecurityGroupIds:
            - sg-5grd5ozhk00073inqkh3s72d

      replicaLimit:
        MaxInstance: 4
      triggers:
        - TriggerName: apig-trigger
          TriggerType: apig
          GatewayId: "gcuph20n3phgiilmgfo6g" # todo: 新建 apig 后填写 gatewayId 即可
          ServiceName: "service-novabackend"
          UpstreamName: "upstream-novabackend"
          RouteName: default
          Path: "/"
          Method:
            - POST
            - GET
            - PUT
            - DELETE
            - HEAD
            - OPTIONS
            - CONNECT
          AdvancedSetting:
            CorsPolicySetting:
              Enable: true
